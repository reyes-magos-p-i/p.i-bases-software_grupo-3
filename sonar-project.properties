sonar.projectKey=reyes-magos-p-i_p.i-bases-software_grupo-3
sonar.organization=reyes-magos-p-i

# Analyze application sources and classify unit and HTTP integration tests separately.
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.spec.js,**/*.test.js,**/*.e2e-spec.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.spec.js,**/*.test.js,**/*.e2e-spec.js
sonar.coverage.exclusions=apps/web/src/loadFBSDK.ts,apps/web/src/facebook-auth.ts,apps/web/src/main.ts


sonar.verbose=true
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
