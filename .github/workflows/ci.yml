name: CI
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.15.0"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Verify backend runtime
        if: matrix.app == 'api'
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 15 || typeof require('node:crypto').argon2 !== 'function') { console.error('The API requires Node ^24.15.0 with crypto.argon2.'); process.exit(1); }"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:cov
      - name: Typecheck
        if: matrix.app == 'web'
        run: npm run type-check
      - run: npm run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: SonarQube
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage
      - name: Validate and normalize coverage source paths
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const workspace = process.cwd();
          for (const app of ['api', 'web']) {
            const appRoot = path.join(workspace, 'apps', app);
            const report = path.join(appRoot, 'coverage', 'lcov.info');
            let sources = 0;
            const normalized = fs.readFileSync(report, 'utf8').replace(/^SF:(.+)\r?$/gm, (_, entry) => {
              const source = entry.trim().replaceAll('\\', '/');
              const target = path.isAbsolute(source)
                ? source
                : path.resolve(source.startsWith('apps/') ? workspace : appRoot, source);
              const relative = path.relative(appRoot, target);
              if (relative.startsWith('..') || path.isAbsolute(relative) || !fs.existsSync(target)) {
                throw new Error('Invalid coverage source for ' + app + ': ' + source);
              }
              sources++;
              return 'SF:' + path.relative(workspace, target).split(path.sep).join('/');
            });
            if (sources === 0) throw new Error('Empty coverage report for ' + app);
            fs.writeFileSync(report, normalized);
            console.log('Validated ' + sources + ' coverage sources for ' + app);
          }
          NODE
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy
    needs: [ci, sonarqube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build and serve
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail
            cd /opt/app/p.i-bases-software_grupo-3
            git fetch origin main

            git checkout main
            git reset --hard origin/main

            cd apps/api
            node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 15 || typeof require('node:crypto').argon2 !== 'function') { console.error('The API requires Node ^24.15.0 with crypto.argon2.'); process.exit(1); }"
            npm ci
            npm run build

            cd ../web
            npm ci
            npm run build-only

            sudo systemctl restart cinetadel-api.service
            sudo systemctl --no-pager --full status cinetadel-api.service
