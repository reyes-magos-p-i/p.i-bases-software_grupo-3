name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && '["api","web"]' || steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  ci:
    name: CI (${{ matrix.app }})
    needs: [changes]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "^24.15.0"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Verify backend runtime
        if: matrix.app == 'api'
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 15 || typeof require('node:crypto').argon2 !== 'function') { console.error('The API requires Node ^24.15.0 with crypto.argon2.'); process.exit(1); }"

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            apps/${{ matrix.app }}/node_modules
            !apps/${{ matrix.app }}/node_modules/.tmp
            !apps/${{ matrix.app }}/node_modules/.vite
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Cache build state
        uses: actions/cache@v4
        with:
          path: |
            apps/${{ matrix.app }}/.cache
            apps/api/dist
            apps/web/node_modules/.tmp
            apps/web/node_modules/.vite/vitest
          key: build-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-
            build-${{ runner.os }}-${{ matrix.app }}-

      - name: Lint
        run: npm run lint -- --cache --cache-location .cache/eslint/ --cache-strategy content

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run ${{ matrix.app == 'web' && 'build-only' || 'build' }}

      - name: Test with coverage
        run: npm run test:cov ${{ matrix.app == 'api' && '-- --cacheDirectory=.cache/jest' || '' }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  ci-result:
    name: CI result
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          echo "changes: $CHANGES_RESULT, ci: $CI_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then exit 1; fi
          if [ "$CI_RESULT" != "success" ] && [ "$CI_RESULT" != "skipped" ]; then exit 1; fi

  sonarqube:
    name: SonarQube
    needs: [changes, ci-result]
    if: success() && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download api coverage
        if: contains(fromJSON(needs.changes.outputs.apps), 'api')
        uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage

      - name: Download web coverage
        if: contains(fromJSON(needs.changes.outputs.apps), 'web')
        uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy
    needs: [sonarqube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build and serve
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail
            cd /opt/app/p.i-bases-software_grupo-3
            git fetch origin main

            git checkout main
            git reset --hard origin/main

            cd apps/api
            node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 15 || typeof require('node:crypto').argon2 !== 'function') { console.error('The API requires Node ^24.15.0 with crypto.argon2.'); process.exit(1); }"
            npm ci
            npm run build

            cd ../web
            npm ci
            npm run build-only

            sudo systemctl restart cinetadel-api.service
            sudo systemctl --no-pager --full status cinetadel-api.service
