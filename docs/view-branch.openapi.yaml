openapi: 3.0.3
info:
  title: Ver sucursales
  version: 1.0.0
  description: >-
    Listado y detalle de sucursales (tabla CINEMAS) para administradores (SCRUM-35).
    Consultas de solo lectura. Los nombres de solo espacios se devuelven como null.
servers:
  - url: /api
security:
  - employeeCookie: []
  - bearerAuth: []
paths:
  /cinemas/list:
    get:
      summary: Listar sucursales activas
      description: >-
        Solo sucursales con STATUS = 'ACTIVE', ordenadas por ID. La búsqueda compara el
        nombre sin distinguir mayúsculas ni tildes; si tiene forma de ID (SU-001, su1, 001
        o 1) también busca por ID. Una página mayor que la última devuelve la última.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            pattern: \S
          description: Se recortan los espacios de los extremos y se unen los internos.
        - name: companyId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            enum: [10, 20, 50]
            default: 10
      responses:
        "200":
          description: Una página de sucursales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"
  /cinemas/companies:
    get:
      summary: Listar compañías
      description: Todas las compañías por nombre; las que no tienen nombre van al final.
      responses:
        "200":
          description: Compañías disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"
  /cinemas/{id}:
    get:
      summary: Ver una sucursal
      description: Devuelve la sucursal con cualquier estado.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico (BRANCH_ID), sin el prefijo SU-.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: Datos de la sucursal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La sucursal no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                message: La sucursal seleccionada no existe.
                error: Not Found
        "500":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    employeeCookie:
      type: apiKey
      in: cookie
      name: cinetadel_employee_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de personal. Los tokens de clientes son rechazados.
  schemas:
    Branch:
      type: object
      required: [id, name, companyId, companyName]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          nullable: true
          description: null cuando el nombre guardado es solo espacios.
          example: Sucursal Heredia Centro
        companyId:
          type: integer
          example: 2
        companyName:
          type: string
          nullable: true
          description: null cuando el nombre de la compañía es solo espacios.
          example: Cinetadel S.A
    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
    BranchPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Parámetros inválidos o no permitidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Sesión ausente, inválida o revocada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        El usuario no es administrador, o su contraseña venció (code PASSWORD_EXPIRED).
        No devuelve datos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Error inesperado, sin detalles de Oracle.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
