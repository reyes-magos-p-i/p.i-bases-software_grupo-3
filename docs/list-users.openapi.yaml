openapi: 3.0.3
info:
  title: Consulta de usuarios
  version: 1.0.0
  description: Listados paginados separados de clientes y personal. La creación se documenta en create-user.openapi.yaml.
servers:
  - url: /api
security:
  - employeeCookie: []
  - bearerAuth: []
paths:
  /users/clients:
    get:
      summary: Listar clientes
      description: Permitido para empleados y administradores con identidad vigente en Oracle.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Direction"
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, email, createdAt]
            default: id
      responses:
        "200":
          description: Página y conteo total; cero coincidencias es una consulta exitosa.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Unavailable"
  /users/employees:
    get:
      summary: Listar empleados y administradores
      description: Exclusivo de administradores. No acepta identificadores o roles de sesión enviados por el consumidor como prueba de autorización.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Direction"
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, email, createdAt, hireDate, role, branch]
            default: id
        - name: role
          in: query
          description: Roles separados por comas; un solo valor sigue siendo válido. Omitir para incluir todos los roles.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items:
              type: string
              enum: [EMPLOYEE, ADMINISTRATOR]
        - name: branchId
          in: query
          description: Sucursales separadas por comas; coincidir con cualquiera de ellas. Omitir para incluir todas las sucursales. Se combina con rol y búsqueda.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 1000
            uniqueItems: true
            items:
              type: integer
              minimum: 1
              maximum: 9007199254740991
      responses:
        "200":
          description: Personal que coincide con todos los filtros, paginado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"
  /users/employees/options:
    get:
      summary: Consultar sucursales para filtrar empleados
      description: Exclusivo de administradores; no carga los catálogos de dirección.
      responses:
        "200":
          description: Sucursales reales, ordenadas por nombre e ID.
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id:
                          type: integer
                        label:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    employeeCookie:
      type: apiKey
      in: cookie
      name: cinetadel_employee_session
      description: Cookie HttpOnly del personal. No enviar simultáneamente con Bearer.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      description: Texto Unicode no vacío, sin caracteres de control, máximo 400 bytes UTF-8. Cada término debe coincidir con el nombre completo; también busca correo, ID y teléfono. Ignora mayúsculas y conserva tildes. Omitir para listar todos; no se aceptan arrays. Los comodines de LIKE se interpretan literalmente.
      schema:
        type: string
        minLength: 1
        x-max-utf8-bytes: 400
    Page:
      name: page
      in: query
      description: Se ajusta a la última página si excede los resultados disponibles.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 10
    Direction:
      name: sortDirection
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  schemas:
    Pagination:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [10, 25, 50, 100]
        totalPages:
          type: integer
          minimum: 0
          description: Cero si no existen coincidencias; en ese caso page es 1.
    Client:
      type: object
      required: [id, name, email, phoneNumber, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: UTC. NULL para fechas históricas desconocidas.
    Employee:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [role, branchId, branchName, hireDate]
          properties:
            role:
              type: string
              enum: [EMPLOYEE, ADMINISTRATOR]
            branchId:
              type: integer
            branchName:
              type: string
            hireDate:
              type: string
              format: date
              nullable: true
              description: YYYY-MM-DD sin hora. NULL solo para históricos desconocidos; obligatorio al crear personal.
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
  responses:
    InvalidQuery:
      description: Búsqueda, filtros, parámetros desconocidos o paginación inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Sesión ausente, inválida, expirada o identidad eliminada.
    Forbidden:
      description: El rol vigente no autoriza consultar personal.
    Unavailable:
      description: Error interno genérico, sin detalles de Oracle ni resultados parciales.
