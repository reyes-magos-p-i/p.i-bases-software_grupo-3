openapi: 3.0.3
info:
  title: Perfil de cliente de Cinetadel
  version: 1.0.0
servers:
  - url: /api
security:
  - clientBearer: []
paths:
  /clients/me:
    get:
      summary: Consultar los datos del cliente autenticado
      responses:
        "200":
          description: Datos propios; Cache-Control no-store. Nunca incluye contraseñas ni hashes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Actualizar los datos personales propios
      description: Requiere Origin autorizado. No admite correo, ID, rol, estado, fechas ni idioma. Rechaza actualizaciones vacías y campos desconocidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "204":
          description: Datos actualizados en una transacción
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La cuenta dejó de existir antes de la actualización
        "409":
          description: La cuenta dejó de estar activa
  /clients/me/address-options:
    get:
      summary: Obtener catálogos de direcciones sin datos de sucursales
      responses:
        "200":
          description: Provincias, cantones y distritos; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [provinces, cantons, districts]
                properties:
                  provinces:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogOption"
                  cantons:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CatalogOption"
                        - type: object
                          required: [provinceId]
                          properties:
                            provinceId: { type: integer, minimum: 1 }
                  districts:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CatalogOption"
                        - type: object
                          required: [cantonId]
                          properties:
                            cantonId: { type: integer, minimum: 1 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clients/me/deactivate:
    patch:
      summary: Desactivar la cuenta propia y revocar todas sus sesiones
      description: Requiere Origin autorizado. Conserva datos e historial. No acepta seleccionar otra cuenta.
      responses:
        "204":
          description: Desactivación y revocación completadas en una transacción
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La cuenta dejó de existir
        "409":
          description: La cuenta ya estaba inactiva
  /clients/me/email-change:
    post:
      summary: Enviar confirmación al nuevo correo sin modificar la cuenta
      description: Origin autorizado; cinco solicitudes por minuto por IP. Enlace válido durante 30 minutos. El correo anterior permanece vigente hasta confirmar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 150
                  description: Se normaliza a minúsculas y sin espacios externos; respeta el límite de almacenamiento del CRUD.
      responses:
        "202":
          description: Correo aceptado por el transporte SMTP; el correo registrado aún no cambió
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El correo está reservado por otro cliente
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: No se pudo enviar la confirmación; la cuenta no fue modificada
  /clients/email-change/confirm:
    post:
      security: []
      summary: Confirmar explícitamente el nuevo correo
      description: Origin autorizado; cinco solicitudes por minuto por IP. No requiere sesión. Comprueba firma, propósito, audiencia, vencimiento y versión de la cuenta. Cambia el correo y revoca sesiones de forma atómica. No emite sesión ni cookie. GET no realiza cambios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  {
                    type: string,
                    maxLength: 4096,
                    description: JWT del fragmento del enlace enviado al nuevo correo,
                  }
      responses:
        "200":
          description: Correo actualizado; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [clientId]
                properties:
                  clientId: { type: integer, minimum: 1 }
        "400":
          description: Enlace inválido, vencido, utilizado o invalidado por un cambio en la cuenta
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Correo reservado por otro cliente antes de confirmar
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    clientBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized:
      description: Sesión ausente, inválida, vencida o revocada; cuenta inactiva
    Forbidden:
      description: Cuenta de personal, origen no autorizado o contraseña pendiente de configurar o vencida
    Invalid:
      description: Datos inválidos; mensaje en español identifica los campos incorrectos
    RateLimited:
      description: Demasiadas solicitudes; esperar el período indicado por Retry-After
  schemas:
    CatalogOption:
      type: object
      required: [id, label]
      properties:
        id: { type: integer, minimum: 1 }
        label: { type: string }
    AddressUpdate:
      type: object
      nullable: true
      additionalProperties: false
      required: [districtId]
      properties:
        districtId: { type: integer, minimum: 1, maximum: 9007199254740991 }
        details:
          type: string
          nullable: true
          description: Límite de almacenamiento de 255 bytes del CRUD existente; el contador de la interfaz muestra caracteres.
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Nombres con letras y espacios; límite de almacenamiento de 100 bytes por campo. Las restricciones y normalización se heredan del CRUD.
      properties:
        firstName: { type: string, minLength: 1 }
        secondName: { type: string, nullable: true }
        firstSurname: { type: string, nullable: true }
        secondSurname: { type: string, nullable: true }
        phoneNumber:
          {
            type: string,
            nullable: true,
            description: Celular de Costa Rica de ocho dígitos iniciado por 6,
            7 u 8; prefijo +506 opcional,
          }
        gender: { type: string, nullable: true, enum: [M, F, O, N, null] }
        address:
          $ref: "#/components/schemas/AddressUpdate"
    ClientProfile:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [CLIENT] }
        status: { type: string, enum: [ACTIVE] }
        firstName: { type: string }
        secondName: { type: string, nullable: true }
        firstSurname: { type: string, nullable: true }
        secondSurname: { type: string, nullable: true }
        email: { type: string, format: email }
        phoneNumber: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        language: { type: string }
        birthday: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        address:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            provinceId: { type: integer }
            provinceName: { type: string }
            cantonId: { type: integer }
            cantonName: { type: string }
            districtId: { type: integer }
            districtName: { type: string }
            details: { type: string, nullable: true }
