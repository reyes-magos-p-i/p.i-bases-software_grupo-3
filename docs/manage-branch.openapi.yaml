openapi: 3.0.3
info:
  title: Administrar sucursales
  version: 1.0.0
  description: >-
    Crear y modificar sucursales (tabla CINEMAS) para administradores (SCRUM-32 y
    SCRUM-33). Las consultas están en view-branch.openapi.yaml. Las escrituras exigen
    el header Origin del frontend (FRONTEND_URL); con otro origen responden 403.
servers:
  - url: /api
security:
  - employeeCookie: []
  - bearerAuth: []
paths:
  /cinemas:
    post:
      summary: Crear una sucursal
      description: >-
        Crea la sucursal con STATUS = 'ACTIVE'. El nombre se recorta y sus tildes se
        unen (NFC) antes de validarlo. La compañía debe existir y tener nombre, y
        ninguna otra sucursal activa puede tener el mismo nombre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
            example:
              name: Sucursal Heredia Centro
              companyId: 21
      responses:
        "201":
          description: Sucursal creada.
          content:
            application/json:
              schema:
                $ref: "view-branch.openapi.yaml#/components/schemas/BranchDetail"
        "400":
          $ref: "#/components/responses/InvalidBranch"
        "401":
          $ref: "view-branch.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/NameTaken"
        "500":
          $ref: "view-branch.openapi.yaml#/components/responses/Unavailable"
  /cinemas/{id}:
    patch:
      summary: Modificar una sucursal
      description: >-
        Cambia el nombre y la compañía de una sucursal activa, con las mismas reglas
        que crear. Conservar su propio nombre no cuenta como repetido.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico (BRANCH_ID), sin el prefijo SU-.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "200":
          description: Sucursal modificada.
          content:
            application/json:
              schema:
                $ref: "view-branch.openapi.yaml#/components/schemas/BranchDetail"
        "400":
          $ref: "#/components/responses/InvalidBranch"
        "401":
          $ref: "view-branch.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BranchGone"
        "409":
          $ref: "#/components/responses/NameTaken"
        "500":
          $ref: "view-branch.openapi.yaml#/components/responses/Unavailable"
components:
  securitySchemes:
    employeeCookie:
      type: apiKey
      in: cookie
      name: cinetadel_employee_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de personal. Los tokens de clientes son rechazados.
  schemas:
    BranchRequest:
      type: object
      additionalProperties: false
      required: [name, companyId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: "^[\\p{L}\\p{M} ]+$"
          description: Solo letras (con tildes y ñ) y espacios.
        companyId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
  responses:
    InvalidBranch:
      description: >-
        Datos inválidos. message trae todos los errores, con los mismos textos que el
        formulario: «El nombre es obligatorio», «El nombre solo puede contener letras y
        espacios», «El nombre debe tener entre 1 y 50 caracteres» y «Debe seleccionar
        una compañía» (también cuando la compañía no existe o no tiene nombre).
      content:
        application/json:
          schema:
            $ref: "view-branch.openapi.yaml#/components/schemas/Error"
          example:
            statusCode: 400
            message: [El nombre es obligatorio, Debe seleccionar una compañía]
            error: Bad Request
    Forbidden:
      description: >-
        El usuario no es administrador, su contraseña venció (code PASSWORD_EXPIRED) o
        la petición viene de otro origen.
      content:
        application/json:
          schema:
            $ref: "view-branch.openapi.yaml#/components/schemas/Error"
    NameTaken:
      description: >-
        Otra sucursal activa ya tiene ese nombre, sin distinguir mayúsculas ni tildes.
        Las sucursales inactivas no cuentan.
      content:
        application/json:
          schema:
            $ref: "view-branch.openapi.yaml#/components/schemas/Error"
          example:
            statusCode: 409
            message: Ya existe una sucursal activa con ese nombre
            error: Conflict
    BranchGone:
      description: La sucursal no existe o está inactiva.
      content:
        application/json:
          schema:
            $ref: "view-branch.openapi.yaml#/components/schemas/Error"
          example:
            statusCode: 404
            message: La sucursal no existe o ya fue desactivada
            error: Not Found
