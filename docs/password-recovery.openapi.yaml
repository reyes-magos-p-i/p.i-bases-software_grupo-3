openapi: 3.0.3
info:
  title: Recuperación de contraseña de Cinetadel
  version: 1.0.0
  description: >-
    Recuperación pública para cuentas locales activas de clientes y personal.
    Requiere Origin igual a FRONTEND_URL. El enlace y la contraseña temporal
    vencen en 30 minutos; no se emite una sesión durante este flujo.
servers:
  - url: /api
paths:
  /auth/password-recovery/request:
    post:
      summary: Solicitar instrucciones por correo
      description: >-
        Devuelve el mismo mensaje para cualquier correo con formato válido.
        Solo envía a cuentas elegibles. Un reenvío por cuenta requiere esperar
        un minuto. La contraseña actual permanece intacta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, accountType]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 150
                accountType:
                  type: string
                  enum: [client, employee]
      responses:
        "200":
          description: Solicitud procesada sin revelar la existencia de la cuenta
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/Unavailable"
  /auth/password-recovery/validate:
    post:
      summary: Comprobar un enlace sin consumirlo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Token"
      responses:
        "200":
          description: Enlace válido; no devuelve datos personales
          content:
            application/json:
              schema:
                type: object
                required: [accountType, expiresAt]
                properties:
                  accountType: { type: string, enum: [client, employee] }
                  expiresAt: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/Unavailable"
  /auth/password-recovery/reset:
    post:
      summary: Consumir la recuperación y guardar la nueva contraseña
      description: >-
        Valida la contraseña temporal, coincidencia, política existente y
        diferencia respecto de la contraseña actual. Cinco temporales incorrectas
        invalidan la recuperación. Actualiza y consume en una transacción e
        invalida sesiones anteriores. No devuelve contraseñas ni JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  token,
                  temporaryPassword,
                  newPassword,
                  confirmNewPassword,
                  expirationDays,
                ]
              properties:
                token: { type: string, pattern: "^[a-f0-9]{64}$" }
                temporaryPassword:
                  {
                    type: string,
                    format: password,
                    minLength: 1,
                    maxLength: 128,
                  }
                newPassword:
                  {
                    type: string,
                    format: password,
                    minLength: 8,
                    maxLength: 128,
                  }
                confirmNewPassword:
                  {
                    type: string,
                    format: password,
                    minLength: 1,
                    maxLength: 128,
                  }
                expirationDays: { type: integer, enum: [30, 60, 90, 120] }
      responses:
        "200":
          description: Contraseña actualizada; puede iniciar sesión nuevamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          $ref: "#/components/responses/OriginRejected"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/Unavailable"
components:
  schemas:
    Token:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
  responses:
    InvalidInput:
      description: >-
        Campos inválidos o rechazo con código RECOVERY_INVALID,
        TEMPORARY_PASSWORD_INCORRECT, PASSWORDS_DO_NOT_MATCH,
        NEW_PASSWORD_SAME_AS_CURRENT o PASSWORD_POLICY_VIOLATION.
    OriginRejected:
      description: El origen no coincide con FRONTEND_URL
    Throttled:
      description: Más de cinco solicitudes por minuto/IP/proceso para este endpoint
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
    Unavailable:
      description: Fallo interno sin detalles privados; no se confirma la operación
