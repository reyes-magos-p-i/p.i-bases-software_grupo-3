openapi: 3.0.3
info:
  title: Cinetadel — Compra de boletos para clientes e invitados
  version: 1.1.0
servers:
  - url: /api
security:
  - clientBearer: []
paths:
  /guest-purchases/movies/{id}/functions:
    get:
      security: []
      summary: Película y funciones disponibles sin sesión
      description: Máximo 60 solicitudes por minuto y cliente de red. Cache-Control no-store.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/paths/~1purchases~1movies~1{id}~1functions/get/responses/200"
        "400": { description: Identificador inválido }
        "404": { description: La película no existe }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /guest-purchases/functions/{id}/seats:
    get:
      security: []
      summary: Disponibilidad de asientos para invitados
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/paths/~1purchases~1functions~1{id}~1seats/get/responses/200"
        "400": { description: Identificador inválido }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /guest-purchases/quote:
    post:
      security: []
      summary: Resumen de invitado con las mismas tarifas y sin reserva temporal
      description: Exige Origin permitido. Máximo 60 solicitudes por minuto y cliente de red.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Selection" }
      responses:
        "200":
          description: Resumen calculado en el servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { description: Selección inválida }
        "403": { description: Origen no autorizado }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /guest-purchases/buyer:
    post:
      security: []
      summary: Comprueba el correo y su confirmación antes de continuar
      description: Exige Origin permitido. Máximo 10 solicitudes por minuto. No crea una cuenta ni envía correos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestBuyer" }
      responses:
        "200":
          description: Correo normalizado para continuar como invitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
        "400": { description: Correo inválido o confirmación diferente }
        "403": { description: Origen no autorizado }
        "409":
          {
            description: CLIENT_LOGIN_REQUIRED; la cuenta existente debe iniciar sesión,
          }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /guest-purchases:
    post:
      security: []
      summary: Confirma atómicamente la compra de invitado
      description: Exige Origin permitido y correo no registrado. Máximo 10 solicitudes por minuto. Conserva requestKey, correo, selección y quoteVersion al reintentar un resultado incierto. No envía correos ni crea sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Selection"
                - type: object
                  required: [buyer, requestKey, quoteVersion]
                  properties:
                    buyer: { $ref: "#/components/schemas/GuestBuyer" }
                    requestKey: { type: string, format: uuid }
                    quoteVersion: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "201":
          description: Comprobante y código privado estable de consulta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestReceipt" }
        "400": { description: Solicitud inválida }
        "403": { description: Origen no autorizado }
        "404": { description: La función no existe }
        "409":
          {
            description: Cuenta registrada (CLIENT_LOGIN_REQUIRED),
            selección no disponible,
            resumen modificado o referencia reutilizada,
          }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: No se pudieron preparar los boletos }
  /guest-purchases/lookup:
    post:
      security: []
      summary: Consulta privada de una compra de invitado mediante su código
      description: Exige Origin permitido. Máximo 10 solicitudes por minuto. Código en el cuerpo, sin caché. No acepta un correo o número de factura como autorización ni consulta facturas de cuentas registradas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessCode]
              additionalProperties: false
              properties:
                accessCode:
                  {
                    type: string,
                    maxLength: 85,
                    pattern: "^INV-[1-9][0-9]{0,15}-[a-fA-F0-9]{64}$",
                  }
      responses:
        "200":
          description: Comprobante con boletos; el QR se genera en la interfaz con la referencia pública
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestReceipt" }
        "400": { description: Código incompleto o con formato inválido }
        "403": { description: Origen no autorizado }
        "404":
          {
            description: No se encontró una compra con ese código; no expone datos personales,
          }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /purchases/movies/{id}/functions:
    get:
      summary: Película y funciones disponibles para comprar
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Película y funciones activas, futuras y disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  movie:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      synopsis: { type: string, maxLength: 1000 }
                      posterImage: { type: string, nullable: true }
                  functions:
                    type: array
                    items: { $ref: "#/components/schemas/Function" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: La película no existe }
  /purchases/functions/{id}/seats:
    get:
      summary: Mapa físico y disponibilidad actual por función
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Función, asientos y categorías con su tarifa base
          content:
            application/json:
              schema:
                type: object
                properties:
                  function: { $ref: "#/components/schemas/Function" }
                  seats:
                    type: array
                    items: { $ref: "#/components/schemas/Seat" }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, enum: [GENERAL, CHILD, SENIOR] }
                        label: { type: string }
                        description: { type: string }
                        base: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /purchases/quote:
    post:
      summary: Calcula un resumen sin reservar asientos
      description: Exige Origin permitido. Máximo 60 solicitudes por minuto y cliente de red.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Selection" }
      responses:
        "200":
          description: Resumen con precios del servidor y versión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400":
          {
            description: Selección vacía,
            repetida,
            inválida o campos no permitidos,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /purchases:
    post:
      summary: Registra la compra completa mediante pago simulado
      description: Exige Origin permitido. Máximo 10 solicitudes por minuto y cliente de red. No acepta importes ni un identificador de cliente. Repetir la referencia con la misma selección devuelve la factura existente. Después de un timeout u otra respuesta incierta, conservar requestKey y la selección al reintentar, incluso si la siguiente respuesta es un 409 por bloqueo o un 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Selection"
                - type: object
                  required: [requestKey, quoteVersion]
                  properties:
                    requestKey: { type: string, format: uuid }
                    quoteVersion: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "201":
          description: Compra registrada o recuperada por idempotencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { description: Solicitud inválida }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: La función no existe }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: No se pudieron preparar los boletos }
  /purchases/me:
    get:
      summary: Historial exclusivo del cliente autenticado
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Diez compras por página; items, page, total y totalPages. Cada compra incluye id, reference, purchasedAt, status, total, title, startsAt y quantity.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /purchases/me/{id}:
    get:
      summary: Factura y boletos propios, con sus funciones actuales
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Datos originales de compra y boletos vinculados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: La compra no existe o no pertenece a la cuenta }
  /projections/price-preview:
    post:
      summary: Vista previa administrativa de la política de boletos
      description: Requiere sesión administrativa y Origin permitido; no crea una función.
      security:
        - employeeCookie: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingSettings" }
      responses:
        "200":
          {
            description: Configuración,
            base,
            recargos,
            precio unitario general y categorías,
          }
        "400": { description: Formato o tecnología incompatible }
        "401": { description: Sesión ausente o vencida }
        "403": { description: Permisos, contraseña u origen no autorizados }
components:
  securitySchemes:
    clientBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    employeeCookie:
      { type: apiKey, in: cookie, name: cinetadel_employee_session }
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
  responses:
    TooManyRequests:
      description: Límite de solicitudes de compra alcanzado
      headers:
        Retry-After:
          description: Segundos que deben transcurrir antes de reintentar
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer, example: 429 }
              message:
                type: string
                example: Has realizado demasiadas solicitudes de compra. Espera un minuto e intenta nuevamente.
    Unauthorized:
      { description: Sesión ausente, vencida, revocada o cuenta desactivada }
    Forbidden:
      {
        description: Se requiere cliente,
        contraseña vigente u origen permitido,
      }
    Conflict:
      description: Función no disponible, asientos vendidos, resumen modificado o referencia reutilizada para otra selección. Puede incluir code FUNCTION_UNAVAILABLE, SEATS_UNAVAILABLE o QUOTE_CHANGED.
  schemas:
    GuestBuyer:
      type: object
      required: [email, confirmEmail]
      properties:
        email: { type: string, format: email, maxLength: 150 }
        confirmEmail:
          {
            type: string,
            format: email,
            maxLength: 150,
            description: Debe coincidir con email; ambas direcciones se normalizan antes de comparar,
          }
    GuestReceipt:
      allOf:
        - $ref: "#/components/schemas/Receipt"
        - type: object
          required: [accessCode]
          properties:
            accessCode:
              {
                type: string,
                description: Código privado de consulta; debe guardarse y no se incorpora al QR,
              }
    PricingSettings:
      type: object
      properties:
        format: { type: string, enum: ["2D", "3D"], default: "2D" }
        technology:
          { type: string, enum: [STANDARD, IMAX, "70MM"], default: STANDARD }
        isPremiere: { type: boolean, default: false }
    Function:
      allOf:
        - $ref: "#/components/schemas/PricingSettings"
        - type: object
          properties:
            id: { type: integer }
            movieId: { type: integer }
            title: { type: string }
            synopsis: { type: string }
            posterImage: { type: string, nullable: true }
            branchId: { type: integer }
            branchName: { type: string }
            theaterId: { type: integer }
            rows: { type: integer }
            columns: { type: integer }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            status: { type: string }
            available: { type: boolean }
            price:
              { type: number, description: General sin recargo de asiento VIP }
    Seat:
      type: object
      properties:
        positionId: { type: integer, minimum: 1, maximum: 10000 }
        theaterId: { type: integer }
        rowNumber: { type: integer }
        columnNumber: { type: integer }
        type: { type: string, enum: [normal, vip, accessibility] }
        state: { type: string, enum: [free, in-use, unavailable, reserved] }
        category: { type: string, enum: [GENERAL, CHILD, SENIOR] }
    Positions:
      type: array
      maxItems: 10000
      uniqueItems: true
      items: { type: integer, minimum: 1, maximum: 10000 }
    Selection:
      type: object
      required: [functionId, seats]
      properties:
        functionId: { type: integer, minimum: 1, maximum: 9007199254740991 }
        seats:
          type: object
          required: [GENERAL, CHILD, SENIOR]
          additionalProperties: false
          properties:
            GENERAL: { $ref: "#/components/schemas/Positions" }
            CHILD: { $ref: "#/components/schemas/Positions" }
            SENIOR: { $ref: "#/components/schemas/Positions" }
    Line:
      type: object
      properties:
        code: { type: string }
        category: { type: string, enum: [GENERAL, CHILD, SENIOR] }
        label: { type: string }
        vip: { type: boolean }
        quantity: { type: integer }
        base: { type: number }
        unitPrice: { type: number }
        subtotal: { type: number }
        modifiers:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: number }
    Quote:
      type: object
      properties:
        function: { $ref: "#/components/schemas/Function" }
        seats:
          type: array
          items: { $ref: "#/components/schemas/Seat" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/Line" }
        total: { type: number }
        quantity: { type: integer }
        version: { type: string }
    Receipt:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string, example: ORD-000012 }
        purchasedAt: { type: string, format: date-time }
        status: { type: string, enum: [PAID, CANCELLED] }
        buyerEmail: { type: string, format: email }
        total: { type: number }
        function: { $ref: "#/components/schemas/Function" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/Line" }
        tickets:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              rowNumber: { type: integer }
              columnNumber: { type: integer }
              theaterId: { type: integer }
              functionId: { type: integer }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              functionStatus: { type: string }
              unitPrice: { type: number }
              category: { type: string, enum: [GENERAL, CHILD, SENIOR] }
